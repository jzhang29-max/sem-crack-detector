<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1872" viewBox="0 0 980 1872"><defs>
        <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1B242C" flood-opacity="0.14"/>
        </filter></defs><rect x="0" y="0" width="980" height="1872" rx="0" ry="0" fill="#F7F5F0"   opacity="1.0"/><text x="490.0" y="52" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1B242C" text-anchor="middle">Interior Active-Learning: Command Reference</text><text x="490.0" y="82" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#5B6B76" text-anchor="middle">Run each script from interior_active_learning/code/ -- in this order</text><rect x="40" y="130" width="900" height="268" rx="16" ry="16" fill="#FFFFFF"  filter="url(#cardShadow)" opacity="1.0"/><rect x="40" y="130" width="8" height="268" rx="4" ry="4" fill="#2A9D8F"   opacity="1.0"/><circle cx="94" cy="182" r="22" fill="#2A9D8F"/><text x="94" y="188" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">1</text><g transform="translate(138,182) scale(18)"><path d="M -0.55 0.6 L 0.15 -0.1" stroke="#2A9D8F" stroke-width="0.22" stroke-linecap="round"/><path d="M 0.1 -0.15 L 0.75 -0.8 L 0.9 -0.65 L 0.25 0" fill="#2A9D8F"/><circle cx="-0.58" cy="0.63" r="0.13" fill="#2A9D8F"/></g><text x="176" y="188" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B242C">Paint corrections</text><text x="66" y="216" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#5B6B76">Open the paint app, pick an image, and mark what the pipeline got wrong: red =</text><text x="66" y="237" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#5B6B76">crack, cyan = not-crack, magenta = erase entirely. Click Save &amp; Ingest when</text><text x="66" y="258" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#5B6B76">done.</text><rect x="66" y="274" width="848" height="95" rx="10" ry="10" fill="#20262B"   opacity="1.0"/><circle cx="84" cy="292" r="4.5" fill="#EE6A5F"/><circle cx="100" cy="292" r="4.5" fill="#F5BD4F"/><circle cx="116" cy="292" r="4.5" fill="#61C454"/><text x="84" y="322" font-family="SF Mono, Menlo, monospace" font-size="15.5" fill="#D7E0E6">python3 paint_server.py</text><text x="84" y="347" font-family="SF Mono, Menlo, monospace" font-size="15.5" fill="#7C8A93"># then open http://127.0.0.1:8765 in a browser</text><rect x="40" y="420" width="900" height="243" rx="16" ry="16" fill="#FFFFFF"  filter="url(#cardShadow)" opacity="1.0"/><rect x="40" y="420" width="8" height="243" rx="4" ry="4" fill="#5E9C6C"   opacity="1.0"/><circle cx="94" cy="472" r="22" fill="#5E9C6C"/><text x="94" y="478" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">2</text><g transform="translate(138,472) scale(18)"><rect x="-0.32" y="-0.32" width="0.64" height="0.64" rx="0.08" fill="none" stroke="#5E9C6C" stroke-width="0.14"/><line x1="-0.32" y1="0.16" x2="-0.5" y2="0.16" stroke="#5E9C6C" stroke-width="0.06"/><line x1="-0.32" y1="-0.16" x2="-0.5" y2="-0.16" stroke="#5E9C6C" stroke-width="0.06"/><line x1="0.32" y1="0.16" x2="0.5" y2="0.16" stroke="#5E9C6C" stroke-width="0.06"/><line x1="0.32" y1="-0.16" x2="0.5" y2="-0.16" stroke="#5E9C6C" stroke-width="0.06"/><line x1="0.16" y1="0.32" x2="0.16" y2="0.5" stroke="#5E9C6C" stroke-width="0.06"/><line x1="-0.16" y1="0.32" x2="-0.16" y2="0.5" stroke="#5E9C6C" stroke-width="0.06"/><line x1="0.16" y1="-0.32" x2="0.16" y2="-0.5" stroke="#5E9C6C" stroke-width="0.06"/><line x1="-0.16" y1="-0.32" x2="-0.16" y2="-0.5" stroke="#5E9C6C" stroke-width="0.06"/></g><text x="176" y="478" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B242C">Retrain the model</text><text x="66" y="506" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#5B6B76">Run this after painting a batch of new corrections, so the interior model</text><text x="66" y="527" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#5B6B76">actually learns from everything painted so far -- not just the picture, the</text><text x="66" y="548" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#5B6B76">model itself.</text><rect x="66" y="564" width="848" height="70" rx="10" ry="10" fill="#20262B"   opacity="1.0"/><circle cx="84" cy="582" r="4.5" fill="#EE6A5F"/><circle cx="100" cy="582" r="4.5" fill="#F5BD4F"/><circle cx="116" cy="582" r="4.5" fill="#61C454"/><text x="84" y="612" font-family="SF Mono, Menlo, monospace" font-size="15.5" fill="#D7E0E6">python3 train_interior_model.py</text><rect x="40" y="685" width="900" height="297" rx="16" ry="16" fill="#FFFFFF"  filter="url(#cardShadow)" opacity="1.0"/><rect x="40" y="685" width="8" height="297" rx="4" ry="4" fill="#E9B44C"   opacity="1.0"/><circle cx="94" cy="737" r="22" fill="#E9B44C"/><text x="94" y="743" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">3</text><g transform="translate(138,737) scale(18)"><circle cx="0" cy="0" r="0.82" fill="none" stroke="#E9B44C" stroke-width="0.14"/><polyline points="-0.36,0 -0.05,0.32 0.48,-0.34" fill="none" stroke="#E9B44C" stroke-width="0.19" stroke-linecap="round" stroke-linejoin="round"/></g><text x="176" y="743" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B242C">Generate final results</text><text x="66" y="771" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#5B6B76">Applies the (now-updated) model to one image and saves the finished picture --</text><text x="66" y="792" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#5B6B76">color overlay and black/white mask -- to both results/ and review/applied/.</text><rect x="66" y="808" width="848" height="145" rx="10" ry="10" fill="#20262B"   opacity="1.0"/><circle cx="84" cy="826" r="4.5" fill="#EE6A5F"/><circle cx="100" cy="826" r="4.5" fill="#F5BD4F"/><circle cx="116" cy="826" r="4.5" fill="#61C454"/><text x="84" y="856" font-family="SF Mono, Menlo, monospace" font-size="15.5" fill="#D7E0E6">python3 apply_interior_model.py &lt;image_name&gt;</text><text x="84" y="881" font-family="SF Mono, Menlo, monospace" font-size="15.5" fill="#D7E0E6"></text><text x="84" y="906" font-family="SF Mono, Menlo, monospace" font-size="15.5" fill="#7C8A93"># example:</text><text x="84" y="931" font-family="SF Mono, Menlo, monospace" font-size="15.5" fill="#D7E0E6">python3 apply_interior_model.py 260708_316_H_b2_front_CBS_002</text><rect x="40" y="1004" width="900" height="293" rx="16" ry="16" fill="#FFFFFF"  filter="url(#cardShadow)" opacity="1.0"/><rect x="40" y="1004" width="8" height="293" rx="4" ry="4" fill="#7A4C9E"   opacity="1.0"/><circle cx="94" cy="1056" r="22" fill="#7A4C9E"/><text x="94" y="1062" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">4</text><g transform="translate(138,1056) scale(18)"><rect x="-0.45" y="-0.55" width="0.9" height="1.1" rx="0.06" fill="none" stroke="#7A4C9E" stroke-width="0.14"/><line x1="-0.28" y1="-0.2" x2="0.28" y2="-0.2" stroke="#7A4C9E" stroke-width="0.08"/><line x1="-0.28" y1="0.05" x2="0.28" y2="0.05" stroke="#7A4C9E" stroke-width="0.08"/><line x1="-0.28" y1="0.3" x2="0.28" y2="0.3" stroke="#7A4C9E" stroke-width="0.08"/></g><text x="176" y="1062" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B242C">(Optional) Batch review sheets</text><text x="66" y="1090" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#5B6B76">For a bigger labeling push: export a printable contact-sheet batch of the</text><text x="66" y="1111" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#5B6B76">hardest/most-uncertain candidates across all images, fill in TRUE/FALSE/SKIP,</text><text x="66" y="1132" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#5B6B76">then ingest it.</text><rect x="66" y="1148" width="848" height="120" rx="10" ry="10" fill="#20262B"   opacity="1.0"/><circle cx="84" cy="1166" r="4.5" fill="#EE6A5F"/><circle cx="100" cy="1166" r="4.5" fill="#F5BD4F"/><circle cx="116" cy="1166" r="4.5" fill="#61C454"/><text x="84" y="1196" font-family="SF Mono, Menlo, monospace" font-size="15.5" fill="#D7E0E6">python3 active_learning_select.py</text><text x="84" y="1221" font-family="SF Mono, Menlo, monospace" font-size="15.5" fill="#7C8A93"># fill in the UserVerdict column on the exported sheet, then:</text><text x="84" y="1246" font-family="SF Mono, Menlo, monospace" font-size="15.5" fill="#D7E0E6">python3 ingest_labels.py &lt;round_number&gt;</text><rect x="40" y="1319" width="900" height="247" rx="16" ry="16" fill="#FFFFFF"  filter="url(#cardShadow)" opacity="1.0"/><rect x="40" y="1319" width="8" height="247" rx="4" ry="4" fill="#E76F51"   opacity="1.0"/><circle cx="94" cy="1371" r="22" fill="#E76F51"/><text x="94" y="1377" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">5</text><g transform="translate(138,1371) scale(18)"><path d="M -0.6 -0.15 A 0.6 0.6 0 1 1 -0.6 0.2" fill="none" stroke="#E76F51" stroke-width="0.14"/><polygon points="-0.6,0.2 -0.85,-0.05 -0.35,-0.05" fill="#E76F51"/></g><text x="176" y="1377" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B242C">Repeat</text><text x="66" y="1405" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#5B6B76">Paint more corrections on the new results, retrain, regenerate. Each round the</text><text x="66" y="1426" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#5B6B76">model's guesses get a little better, so there's less to fix next time.</text><rect x="66" y="1442" width="848" height="95" rx="10" ry="10" fill="#20262B"   opacity="1.0"/><circle cx="84" cy="1460" r="4.5" fill="#EE6A5F"/><circle cx="100" cy="1460" r="4.5" fill="#F5BD4F"/><circle cx="116" cy="1460" r="4.5" fill="#61C454"/><text x="84" y="1490" font-family="SF Mono, Menlo, monospace" font-size="15.5" fill="#7C8A93"># back to step 1 -- open the paint app again</text><text x="84" y="1515" font-family="SF Mono, Menlo, monospace" font-size="15.5" fill="#D7E0E6">python3 paint_server.py</text><text x="40" y="1608" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B242C">Where things live</text><rect x="40" y="1628" width="900" height="28" rx="8" ry="8" fill="#FFFFFF"  filter="url(#cardShadow)" opacity="1.0"/><text x="56" y="1649" font-family="SF Mono, Menlo, monospace" font-size="13.5" font-weight="600" fill="#E9B44C">paint/&lt;image&gt;_paint_template.png</text><text x="420" y="1649" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B76">Read-only baseline you paint on top of -- regenerated fresh each round.</text><rect x="40" y="1662" width="900" height="28" rx="8" ry="8" fill="#FFFFFF"  filter="url(#cardShadow)" opacity="1.0"/><text x="56" y="1683" font-family="SF Mono, Menlo, monospace" font-size="13.5" font-weight="600" fill="#E9B44C">paint/&lt;image&gt;_painted.png</text><text x="420" y="1683" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B76">Your actual paint layer, copied from the template and drawn on.</text><rect x="40" y="1696" width="900" height="28" rx="8" ry="8" fill="#FFFFFF"  filter="url(#cardShadow)" opacity="1.0"/><text x="56" y="1717" font-family="SF Mono, Menlo, monospace" font-size="13.5" font-weight="600" fill="#E9B44C">candidates/&lt;image&gt;_interior.csv</text><text x="420" y="1717" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B76">Every candidate the model has ever proposed for this image, labeled or not.</text><rect x="40" y="1730" width="900" height="28" rx="8" ry="8" fill="#FFFFFF"  filter="url(#cardShadow)" opacity="1.0"/><text x="56" y="1751" font-family="SF Mono, Menlo, monospace" font-size="13.5" font-weight="600" fill="#E9B44C">models/interior_model.joblib</text><text x="420" y="1751" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B76">The trained model -- rewritten each time you run train_interior_model.py.</text><rect x="40" y="1764" width="900" height="28" rx="8" ry="8" fill="#FFFFFF"  filter="url(#cardShadow)" opacity="1.0"/><text x="56" y="1785" font-family="SF Mono, Menlo, monospace" font-size="13.5" font-weight="600" fill="#E9B44C">results/ and review/applied/</text><text x="420" y="1785" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B76">Final overlay + black/white mask, one pair per image.</text></svg>